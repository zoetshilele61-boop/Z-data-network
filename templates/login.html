<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/manifest.json">
    <title>Z-Data Network - Connexion</title>
    <style>
        body { font-family: 'Arial', sans-serif; background: linear-gradient(135deg, #141E30, #243B55); color: white; text-align: center; margin: 0; padding: 50px; }
        h1 { font-size: 50px; color: #FFD700; }
        .box { background: rgba(255,255,255,0.1); border-radius: 20px; padding: 30px; max-width: 400px; margin: 50px auto; }
        .box input { width: 80%; padding: 10px; border-radius: 5px; margin-bottom: 10px; }
        .box button { background: #FFD700; color: #141E30; border: none; padding: 10px 20px; border-radius: 20px; cursor: pointer; }
        .a { color: #FFD700; text-decoration: none; }
    </style>
</head>
<body>
    <h1>📡 Z-Data Network</h1>
    <div class="box">
        <h2>{{ 'Créer un compte' if mode == 'register' else 'Se connecter' }}</h2>
        <form method="post">
            <input type="email" name="email" placeholder="Email" required><br>
            <input type="password" name="password" placeholder="Mot de passe" required><br>
            <button type="submit">{{ 'S\'inscrire' if mode == 'register' else 'Se connecter' }}</button>
        </form>
        <br>
        {% if mode == 'login' %}
        <a href="/register" class="a">Créer un compte</a>
        {% else %}
        <a href="/login" class="a">Se connecter</a>
        {% endif %}
    </div>
</body>
</html>
