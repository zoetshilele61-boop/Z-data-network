<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/manifest.json">
    <title>Z-Data Network</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #141E30, #243B55); color: white; margin: 0; padding: 20px; }
        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { font-size: 45px; color: #FFD700; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
        .header p { font-size: 18px; opacity: 0.8; }
        #map { height: 55vh; border-radius: 15px; box-shadow: 0 6px 20px rgba(0,0,0,0.5); }
        .btn-container { text-align: center; margin-top: 20px; }
        .btn-test { background: #FFD700; color: #141E30; border: none; padding: 12px 30px; border-radius: 30px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-test:hover { background: #fbbf24; transform: translateY(-2px); }
        .btn-radar { background: #4ade80; color: #141E30; border: none; padding: 12px 30px; border-radius: 30px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-radar:hover { background: #2dd4bf; transform: translateY(-2px); }
        .result-box { background: rgba(0,0,0,0.8); padding: 15px; border-radius: 15px; margin-top: 20px; text-align: center; font-size: 18px; display: none; }
        .result-box h3 { color: #FFD700; }
        .result-box p { font-size: 20px; color: #4ade80; }
        .dir-container { display: flex; justify-content: center; gap: 20px; margin-top: 10px; }
        .dir-item { background: rgba(255,255,255,0.1); padding: 10px; border-radius: 10px; font-size: 16px; }
        .dir-item.best { border: 2px solid #4ade80; }
        .conseil { font-size: 22px; font-weight: bold; margin-top: 15px; color: #4ade80; }
    </style>
</head>
<body>

    <div class="header">
        <h1>📡 Z-Data Network</h1>
        <p>Le radar intelligent pour trouver le meilleur signal</p>
    </div>

    <div id="map"></div>

    <div class="btn-container">
        <button class="btn-test" onclick="testerConnexion()">📍 Tester ma connexion ici</button>
        <button class="btn-radar" onclick="trouverBonCote()">🧭 Radar 4 Directions</button>
    </div>

    <div class="result-box" id="result-box">
        <h3>Résultats du test</h3>
        <p id="result-text"></p>
        <div class="dir-container" id="dir-container"></div>
        <p class="conseil" id="conseil"></p>
    </div>

    <script>
        var map = L.map('map').setView([-4.4419, 15.2663], 12);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        var heatPoints = [];
        var heatLayer = L.heatLayer([], {radius: 30, blur: 20, gradient: {0.2: 'blue', 0.4: 'yellow', 0.6: 'orange', 0.8: 'red'}}).addTo(map);
        var socket = io();

        socket.on('nouvelle_mesure', function(data) {
            var color = data.download > 10 ? 'green' : data.download > 2 ? 'orange' : 'red';
            L.circleMarker([data.lat, data.lng], {color: color, radius: 8, weight: 2}).addTo(map);
            heatPoints.push([data.lat, data.lng, Math.min(data.download/20, 1.0)]);
            heatLayer.setLatLngs(heatPoints);
        });

        function testerConnexion() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(function(position) {
                    var lat = position.coords.latitude;
                    var lng = position.coords.longitude;
                    var operator = prompt("Quel est votre opérateur ?", "Airtel");
                    fetch('/test', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({lat: lat, lng: lng, operator: operator})
                    })
                    .then(response => response.json())
                    .then(data => {
                        if (data.download) {
                            var resultBox = document.getElementById('result-box');
                            var resultText = document.getElementById('result-text');
                            resultBox.style.display = 'block';
                            resultText.innerHTML = "Vitesse : <strong>" + data.download + " Mbps</strong> | Ping : <strong>" + data.ping + " ms</strong> | Opérateur : <strong>" + data.operator + "</strong>";
                            document.getElementById('conseil').innerHTML = data.conseil;
                        } else {
                            alert("Erreur lors du test : " + data.error);
                        }
                    });
                });
            } else {
                alert("Géolocalisation non supportée.");
            }
        }

        function trouverBonCote() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(function(position) {
                    var lat = position.coords.latitude;
                    var lng = position.coords.longitude;
                    fetch('/radar', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({lat: lat, lng: lng})
                    })
                    .then(response => response.json())
                    .then(data => {
                        if (data.resultats) {
                            var resultBox = document.getElementById('result-box');
                            var dirContainer = document.getElementById('dir-container');
                            var conseil = document.getElementById('conseil');
                            resultBox.style.display = 'block';
                            dirContainer.innerHTML = '';
                            data.resultats.forEach(function(item) {
                                var div = document.createElement('div');
                                div.className = 'dir-item ' + (item.direction === data.meilleure.direction ? 'best' : '');
                                div.innerHTML = '<strong>' + item.direction + '</strong><br>' + item.download + ' Mbps<br><small>' + item.ping + ' ms</small>';
                                dirContainer.appendChild(div);
                            });
                            conseil.innerHTML = "Conseil : Dirigez-vous vers le <strong>" + data.meilleure.direction + "</strong> pour avoir la meilleure connexion !";
                        }
                    });
                });
            } else {
                alert("Géolocalisation non supportée.");
            }
        }
    </script>
</body>
</html>
